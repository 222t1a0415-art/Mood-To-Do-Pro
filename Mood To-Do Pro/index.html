<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mood To-Do Pro</title>
  <link rel="icon" type="image/x-icon" href="icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

<h1>🌈 Mood To-Do Pro</h1>

<button onclick="toggleDarkMode()">☀️/🌙 Mode</button>

<div class="input-section">
  <input type="text" id="taskInput" placeholder="Enter task">
  <input type="date" id="deadline">
  <input type="time" id="time">

  <select id="moodSelect">
    <option value="high">⚡ High</option>
    <option value="medium">🌿 Medium</option>
    <option value="low">💤 Low</option>
  </select>

  <button onclick="addTask()">Add</button>
</div>

<h3 id="stats"></h3>

<div class="container">
  <div class="column" id="high" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>⚡ High</h2><ul></ul>
  </div>

  <div class="column" id="medium" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>🌿 Medium</h2><ul></ul>
  </div>

  <div class="column" id="low" ondrop="drop(event)" ondragover="allowDrop(event)">
    <h2>💤 Low</h2><ul></ul>
  </div>
</div>



<script src="script.js"></script>
</body>
</html>
